name: Update RepoSource Registry

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-update
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q generate_list.py tools tests

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate dataset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_list.py

      - name: Generate discovery and trust artifacts
        run: python tools/generate_discovery.py

      - name: Validate generated dataset
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from urllib.parse import urlparse
          from jsonschema import Draft202012Validator

          root = Path('.')
          data = json.loads((root / 'data/repositories.json').read_text(encoding='utf-8'))
          schema = json.loads((root / 'schema/repository.schema.json').read_text(encoding='utf-8'))
          config = json.loads((root / 'config.json').read_text(encoding='utf-8'))
          validator = Draft202012Validator(schema)
          records = data['repositories']
          minimum = int(config['min_stars'])

          ids = [record['repository_id'] for record in records]
          names = [record['full_name'] for record in records]
          if len(ids) != len(set(ids)):
              raise SystemExit('duplicate repository_id detected')
          if len(names) != len(set(names)):
              raise SystemExit('duplicate full_name detected')
          if any(record['stars'] < minimum for record in records):
              raise SystemExit('threshold violation detected')
          expected_order = sorted(records, key=lambda r: (-r['stars'], r['full_name'].lower()))
          if records != expected_order:
              raise SystemExit('non-deterministic dataset ordering detected')

          for record in records:
              errors = list(validator.iter_errors(record))
              if errors:
                  raise SystemExit(f"schema validation failed for {record.get('full_name')}: {errors[0].message}")
              for field in ('created_at', 'updated_at', 'pushed_at', 'indexed_at'):
                  value = record.get(field)
                  if value:
                      datetime.fromisoformat(value.replace('Z', '+00:00'))
              for field in ('html_url', 'api_url'):
                  value = record.get(field)
                  if value:
                      parsed = urlparse(value)
                      if parsed.scheme not in {'http', 'https'} or not parsed.netloc:
                          raise SystemExit(f"invalid URL in {record.get('full_name')}: {field}")

          stats = json.loads((root / 'data/statistics.json').read_text(encoding='utf-8'))
          if stats.get('repository_count') != len(records):
              raise SystemExit('statistics repository_count mismatch')
          if stats.get('minimum_stars') != minimum:
              raise SystemExit('statistics minimum_stars mismatch')

          manifest = json.loads((root / 'data/manifest.json').read_text(encoding='utf-8'))
          if manifest.get('repository_count') != len(records):
              raise SystemExit('manifest repository_count mismatch')
          if manifest.get('dataset_version') != data.get('dataset_version'):
              raise SystemExit('manifest dataset_version mismatch')
          if manifest.get('schema_version') != data.get('schema_version'):
              raise SystemExit('manifest schema_version mismatch')

          metadata = json.loads((root / 'dataset.json').read_text(encoding='utf-8'))
          if metadata.get('@type') != 'Dataset':
              raise SystemExit('dataset.json is not a Schema.org Dataset')
          if metadata.get('provenance', {}).get('repositoryCount') != len(records):
              raise SystemExit('dataset metadata repository count mismatch')
          if metadata.get('provenance', {}).get('generatedAt') != stats.get('generated_at'):
              raise SystemExit('dataset metadata timestamp mismatch')

          for path in (root / 'README.md', root / 'llms.txt', root / 'docs/catalog.md', root / 'docs/data-dictionary.md', root / 'docs/methodology.md'):
              if not path.exists() or not path.read_text(encoding='utf-8').strip():
                  raise SystemExit(f'missing discovery artifact: {path}')

          print(f'Validated {len(records)} repository records and discovery artifacts; threshold={minimum}; schema; URLs; timestamps; statistics; manifest; metadata')
          PY

      - name: Commit changed dataset and discovery artifacts
        run: |
          git config user.name 'RepoSource Registry Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md data/ docs/ dataset.json llms.txt
          if git diff --cached --quiet; then
            echo 'No dataset or discovery changes detected.'
            exit 0
          fi
          git commit -m 'chore(data): update repository registry'
          git push
