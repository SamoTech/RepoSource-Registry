name: Update RepoSource Registry

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: registry-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Generate dataset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_list.py

      - name: Validate generated JSON and schema
        run: |
          python - <<'PY'
          import json
          from jsonschema import validate
          data = json.load(open('data/repositories.json', encoding='utf-8'))
          schema = json.load(open('schema/repository.schema.json', encoding='utf-8'))
          for repo in data['repositories']:
              validate(repo, schema)
          print(f"Validated {len(data['repositories'])} repository records")
          PY

      - name: Commit changed dataset
        run: |
          git config user.name 'RepoSource Registry Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md data/
          if git diff --cached --quiet; then
            echo 'No dataset changes detected.'
            exit 0
          fi
          git commit -m 'chore(data): update repository registry'
          git push
