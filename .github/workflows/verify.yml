name: Verify RepoSource Registry

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m py_compile generate_list.py tools/publish.py
      - name: Check repository whitespace
        run: git diff --check

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.19.0'
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Build web application
        run: npm run build
