name: CI Detective Consumer Test

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  intentional-failure:
    runs-on: ubuntu-latest
    steps:
      - name: Emit representative TypeError failure
        shell: bash
        run: |
          python - <<'PY'
          def add_values(left, right):
              return left + right
          add_values("text", 1)
          PY

  detective:
    if: ${{ failure() }}
    needs: intentional-failure
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    steps:
      - name: Run current CI Detective
        uses: SamoTech/CI-Detective@main
        id: detective
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Validate CI Detective report and outputs
        env:
          DIAGNOSIS: ${{ steps.detective.outputs.diagnosis }}
          CONFIDENCE: ${{ steps.detective.outputs.confidence }}
          SCHEMA_VERSION: ${{ steps.detective.outputs.schema_version }}
        run: |
          test -n "$DIAGNOSIS"
          test -n "$CONFIDENCE"
          test "$SCHEMA_VERSION" = "1.0"
          echo "$DIAGNOSIS" | python -m json.tool
          echo "$DIAGNOSIS" | grep -q 'TypeError'
          echo "$DIAGNOSIS" | grep -q 'intentional-failure'
          echo "$DIAGNOSIS" | grep -q 'schema_version'
          echo "CI Detective generated diagnosis output successfully."
